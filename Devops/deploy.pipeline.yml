trigger: none
pr: none
resources:
  pipelines:
    - pipeline: buildPipeline
      source: "build.pipeline"
      trigger:
        branches:
          include: [main]
pool:
  vmImage: ubuntu-latest
stages:
  - stage: Deploy
    lockBehavior: runLatest
    jobs:
      - deployment: k3s_website
        environment: website-production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: buildPipeline
                  artifact: deploy
                - task: KubectlInstaller@0
                  inputs:
                    kubectlVersion: $(KUBECTL_VERSION)
                - task: DownloadSecureFile@1
                  name: clusterConfig
                  inputs:
                    secureFile: website-kubeconfig
                - script: |
                    set -euo pipefail
                    bundle="$PIPELINE_WORKSPACE/buildPipeline/deploy"
                    export WEBSITE_IMAGE=$(cat "$bundle/image.txt")
                    bash "$bundle/Devops/scripts/deploy.sh"
                  displayName: "Apply exact build and verify Kubernetes rollout"
                  env:
                    KUBECONFIG: $(clusterConfig.secureFilePath)
                    AWS_REGION: $(AWS_REGION)
                    AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
