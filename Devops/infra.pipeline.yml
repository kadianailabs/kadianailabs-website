# =============================================================================
# INFRA PIPELINE  (Azure DevOps)
# -----------------------------------------------------------------------------
# Provisions / updates the AWS infrastructure via CloudFormation
# (Infra/infra.yaml): EC2 host (Docker) + IAM role + security group.
# (The ECR repos are managed separately and are NOT created here.)
#
# Run this ON DEMAND — infrastructure changes are deliberate, so it does not
# auto-trigger. In Azure DevOps point a Pipeline at this path (e.g. name it
# "infra.pipeline") and click "Run".  `aws cloudformation deploy` is idempotent,
# so re-running with no template change is a safe no-op.
#
# -----------------------------------------------------------------------------
# REQUIRED variables (pipeline variables or a linked variable group):
#   AWS_REGION            e.g. us-east-1
#   AWS_ACCESS_KEY_ID     (secret)  \  used to run CloudFormation
#   AWS_SECRET_ACCESS_KEY (secret)  /
#   KeyName               existing EC2 key pair name (for SSH)
#   VpcId                 vpc-xxxxxxxx  (a VPC to launch into)
#   SubnetId              subnet-xxxxxxxx  (a PUBLIC subnet in that VPC)
# Optional (defaults below):
#   SshAllowedCidr        who may SSH in (default 0.0.0.0/0)
#   stackName             CloudFormation stack name (default kadianai)
#
# !! IAM !!  These credentials create EC2/IAM/SG resources, so they need much
# broader permissions than the ECR-push CI user: cloudformation:*, ec2:*,
# iam:CreateRole/PutRolePolicy/PassRole/CreateInstanceProfile/etc. Use dedicated
# infra credentials here; keep the build pipeline's user scoped to ECR push.
# =============================================================================

trigger: none            # run manually — infra changes are deliberate
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  stackName: kadianai
  # Default kept permissive so the stack deploys out of the box; tighten to
  # YOUR_IP/32 by overriding this variable.
  SshAllowedCidr: 0.0.0.0/0

stages:
  - stage: ProvisionInfra
    displayName: "Provision AWS infrastructure (CloudFormation)"
    jobs:
      - job: cloudformation
        steps:
          - checkout: self          # need Infra/infra.yaml from the repo

          # Fail fast with a clear message if a required parameter is missing.
          - script: |
              missing=""
              [ -z "$(KeyName)" ]  && missing="$missing KeyName"
              [ -z "$(VpcId)" ]    && missing="$missing VpcId"
              [ -z "$(SubnetId)" ] && missing="$missing SubnetId"
              if [ -n "$missing" ]; then
                echo "##[error]Missing required variable(s):$missing"
                exit 1
              fi
              echo "Deploying stack '$(stackName)' in $(AWS_REGION)"
            displayName: "Check required variables"

          - script: |
              set -e
              aws cloudformation deploy \
                --template-file Infra/infra.yaml \
                --stack-name "$(stackName)" \
                --capabilities CAPABILITY_IAM \
                --region "$AWS_DEFAULT_REGION" \
                --no-fail-on-empty-changeset \
                --parameter-overrides \
                  KeyName="$(KeyName)" \
                  VpcId="$(VpcId)" \
                  SubnetId="$(SubnetId)" \
                  SshAllowedCidr="$(SshAllowedCidr)"
            displayName: "Deploy / update CloudFormation stack"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

          # Print the stack outputs (public IP, URLs) into the log so you can
          # grab the IP for the ec2-ssh service connection the deploy uses.
          - script: |
              aws cloudformation describe-stacks \
                --stack-name "$(stackName)" \
                --region "$AWS_DEFAULT_REGION" \
                --query "Stacks[0].Outputs" --output table
            displayName: "Show stack outputs"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)
