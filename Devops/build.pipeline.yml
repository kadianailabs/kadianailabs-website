# Register as build.pipeline; reuse the existing ECR repository.
trigger:
  branches:
    include: [main]
pr: none
pool:
  vmImage: ubuntu-latest
variables:
  imagePlatform: linux/amd64
stages:
  - stage: Test
    jobs:
      - job: frontend_tests
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - script: |
              set -euo pipefail
              cd src/Node
              npm ci
              npm test
              npm run build
            displayName: "Test and build website"
      - job: backend_tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: |
              set -euo pipefail
              cd src/Python
              pip install -r requirements.txt
              pytest -v
            displayName: "Preserve Python API tests"
  - stage: BuildAndPush
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: docker
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
              [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
              [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
              tag="${BUILD_SOURCEVERSION}-${BUILD_BUILDID}"
              registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
              image="$registry/$ECR_REPOSITORY:$tag"
              umask 077
              export DOCKER_CONFIG=$(mktemp -d)
              cleanup() {
                docker rm -f website-smoke >/dev/null 2>&1 || true
                rm -rf "$DOCKER_CONFIG"
              }
              trap cleanup EXIT
              aws ecr get-login-password --region "$AWS_REGION" \
                | docker login --username AWS --password-stdin "$registry"
              docker build --platform "$IMAGE_PLATFORM" --build-arg "APP_VERSION=$tag" -t "$image" .
              # Test the runtime with the same filesystem restrictions as Kubernetes.
              docker run -d --name website-smoke --read-only --tmpfs /tmp \
                --cap-drop ALL --security-opt no-new-privileges \
                --memory 128m --cpus 0.1 "$image"
              for attempt in {1..30}; do
                if docker exec website-smoke wget -q -O /dev/null http://127.0.0.1:8080/healthz; then break; fi
                sleep 1
              done
              docker exec website-smoke nginx -t
              docker exec website-smoke wget -q -O /dev/null http://127.0.0.1:8080/
              docker exec website-smoke wget -q -O - http://127.0.0.1:8080/health | python3 -c \
                'import json,sys; assert json.load(sys.stdin)["version"] == sys.argv[1]' "$tag"
              docker push "$image"
              mkdir -p .deploy-bundle/Devops/scripts .deploy-bundle/k8s
              cp Devops/scripts/*.sh .deploy-bundle/Devops/scripts/
              cp k8s/*.yaml .deploy-bundle/k8s/
              printf '%s\n' "$image" > .deploy-bundle/image.txt
            displayName: "Build, smoke test, push and package exact deployment"
            env:
              AWS_REGION: $(AWS_REGION)
              AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
              ECR_REPOSITORY: $(ECR_REPOSITORY)
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              IMAGE_PLATFORM: $(imagePlatform)
          - publish: $(Build.SourcesDirectory)/.deploy-bundle
            artifact: deploy
