# ─────────────────────────────────────────────────────────
# Top-level nginx config for the KadianAI LABS static site.
# Tuned for the nginx-unprivileged image (non-root, /tmp writable).
# ─────────────────────────────────────────────────────────
worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths (container fs is read-only except /tmp).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml text/xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout main;
    error_log   /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
}
