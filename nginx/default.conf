# ─────────────────────────────────────────────────────────
# Server block — mirrors the Amplify customHttp.yml behaviour:
#   security headers on every response, plus per-type cache rules.
# ─────────────────────────────────────────────────────────
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers (applied to all responses) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy    "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'" always;

    # ── Lightweight liveness/readiness endpoint for k8s probes ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── HTML: never cache (matches customHttp.yml "*.html") ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        # Re-declare security headers: a location-level add_header resets inherited ones.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy    "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'" always;
        try_files $uri =404;
    }

    # ── Static assets: cacheable for 30 days (matches "*.ico" rule, extended) ──
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Custom 404 page ──
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
