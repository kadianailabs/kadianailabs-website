apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kadianai-website
  namespace: kadianai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kadianai-website
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
