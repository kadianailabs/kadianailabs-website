apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply everything with:  kubectl apply -k k8s/
# Override the image in CI with:  kustomize edit set image kadianai-website=<ECR_URL>:<tag>
namespace: kadianai-1

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/kadianai-website
    newTag: latest
